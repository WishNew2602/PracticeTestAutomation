<!DOCTYPE html>
<html>
<head>
<title>Left Navigation</title>
<style>
  body {
    margin: 0;
    padding: 10px;
    background-color: #f0f0f0;
    font-family: Arial, sans-serif;
  }
  ul {
    list-style-type: none;
    padding: 0;
  }
  li {
    padding: 8px;
    margin: 5px 0;
    background-color: #ddd;
    border-radius: 4px;
    cursor: pointer;
  }
  li:hover {
    background-color: #ccc;
  }
</style>
</head>
<body>
  <h3>Navigation</h3>
  <ul>
    <li>Home</li>
    <li>About</li>
    <li>Services</li>
    <li>Contact</li>
    <li>FAQ</li>
  </ul>
</body>
</html>
